name: yaoshun

services:
  # A unique service name is essential: Lucon already uses the alias "website"
  # on this network, and sharing that alias would mix traffic between the sites.
  yaoshun-website:
    image: ${WEBSITE_IMAGE:?Set WEBSITE_IMAGE to a published image digest or commit tag}
    restart: unless-stopped
    init: true
    env_file:
      - ${WEBSITE_ENV_FILE:-/opt/yaoshun/apps/website/.env.production}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    networks:
      - edge
    volumes:
      - next_cache:/app/apps/website/.next/cache
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-lucon_default}

volumes:
  next_cache:
